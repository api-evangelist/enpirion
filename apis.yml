name: Enpirion
description: Enpirion was a fabless semiconductor company specializing in high-frequency
  power-management integrated circuits, best known for its PowerSoC family of integrated
  DC-DC converters that combined the controller, MOSFETs, and inductor in a single package
  for point-of-load power conversion in networking, computing, and industrial systems. The
  company was acquired by Altera in 2013 and subsequently absorbed into Intel with Altera in
  2015; the Enpirion brand and its enpirion.com developer/product site are now defunct. It
  never operated a public developer API, documentation portal, or SDK program, so this record
  is retained as a company identity stub rather than an active API provider.
